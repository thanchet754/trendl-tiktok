name: Auto 6-Hour Trend Scanner & Deployment

on:
  schedule:
    - cron: '0 */6 * * *'  # Chạy tự động mỗi 6 tiếng
  workflow_dispatch:        # Cho phép bấm nút chạy thủ công từ GitHub UI

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests beautifulsoup4 openpyxl supabase pydantic python-dateutil pytz

      - name: Execute Full 5-Platform Scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "from web.app import perform_full_scan; perform_full_scan()"

      - name: Commit & Push Fresh Trends Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard.html index.html exports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): auto 6-hour scan update [skip ci]" && git push origin main)
